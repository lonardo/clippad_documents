name: Bug report
description: Something does not work as expected after install
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug.
        Please redact private paths, customer content, tokens, and business data before uploading logs or screenshots.
  - type: input
    id: version
    attributes:
      label: Add-in version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: app
    attributes:
      label: Office app
      options:
        - Word
        - Excel
        - PowerPoint
        - Multiple
        - Installer / setup only
    validations:
      required: true
  - type: input
    id: office_version
    attributes:
      label: Office version
      placeholder: "Microsoft 365, Office 2021, Office 2016, ..."
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 23H2"
    validations:
      required: true
  - type: dropdown
    id: arch
    attributes:
      label: Office architecture
      options:
        - 64-bit
        - 32-bit
        - Not sure
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots, or notes
      description: Redact sensitive content first.
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I installed a build from the official GitHub Release or website.
          required: true
        - label: I removed private/customer data from attachments.
          required: true
