name: VBS / Host contribution
description: Propose a public Host-first VBS function or Host documentation change / 提交公共 Host-first VBS 或 Host 文档改进
title: "[VBS]: "
labels: ["vbs", "community"]
body:
  - type: markdown
    attributes:
      value: |
        Public VBS contributions belong in lonardo/clippad_functions.
        公共 VBS 贡献应提交到 lonardo/clippad_functions。
        Do not attach customer documents, private templates, settings.ini, tokens, or internal deployment material.
        不要上传客户文档、私有模板、settings.ini、令牌或内部部署资料。
  - type: input
    id: script_name
    attributes:
      label: Script or Host method / 脚本或 Host 方法
      placeholder: "Host预设_Excel字段映射导出交付.vbs"
    validations:
      required: true
  - type: dropdown
    id: app
    attributes:
      label: Target app / 目标应用
      options:
        - Word
        - Excel
        - PowerPoint
        - Cross-app / 跨 Office
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risk / 风险
      options:
        - Read-only / 只读
        - Preview / 预览
        - Write / 写入
        - Destructive / 高风险
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal and result / 目标与结果
      description: Describe the repeated task, input, output, and recovery behavior.
    validations:
      required: true
  - type: textarea
    id: host_methods
    attributes:
      label: Required Host methods / 所需 Host 方法
      placeholder: "GetApplication, GetSelectionInfo, BeginWritePlan, PreviewWritePlan"
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification / 验证
      description: Include Office version, 32/64-bit, document state, selection state, and smoke result.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety and license / 安全与许可证
      options:
        - label: I removed private/customer data. / 我已删除私有和客户数据。
          required: true
        - label: The contribution is original or has a compatible license. / 内容原创或许可证兼容。
          required: true
        - label: The code is Host-first and does not bypass the public safety boundary. / 代码使用 Host-first，不绕过公共安全边界。
          required: true
