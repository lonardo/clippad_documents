name: Documentation correction
description: Report an incorrect, incomplete, or misleading public document / 报告公开文档错误、缺失或误导
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: input
    id: page
    attributes:
      label: Page / 页面
      placeholder: "docs/install.md"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem / 问题
      description: Quote the incorrect text and explain why it is wrong.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or proposed wording / 证据或建议文案
      description: Prefer source, installer, Host behavior, or Release evidence.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check / 隐私检查
      options:
        - label: I removed private paths, documents, tokens, and customer information. / 我已删除私有路径、文档、令牌和客户信息。
          required: true
